name: Renderizar vídeo

# Se lanza a mano desde la pestaña Actions de GitHub.
# Elige el vídeo, dale a Run workflow, y al terminar descargas el MP4
# desde la sección Artifacts de esa ejecución.

on:
  workflow_call:
    inputs:
      video:
        required: true
        type: string
      calidad:
        required: false
        default: "80"
        type: string
      reescenificar:
        required: false
        default: false
        type: boolean
      rehacer:
        required: false
        default: ""
        type: string
    secrets:
      PEXELS_API_KEY:
        required: false
      PIXABAY_API_KEY:
        required: false

  workflow_dispatch:
    inputs:
      video:
        description: "Qué vídeo renderizar (el slug: irlanda, noruega, mexico…)"
        required: true
        default: "noruega"
        type: string
      calidad:
        description: "Calidad de imagen (más alto = mejor y más pesado)"
        required: false
        default: "80"
        type: string
      reescenificar:
        description: "Rehacer la imagen antes de renderizar (no gasta créditos de voz)"
        required: false
        default: false
        type: boolean
      rehacer:
        description: "Qué escenas rehacer: vacío = solo las que falten · todo · b3,b7"
        required: false
        default: ""
        type: string

permissions:
  contents: write

# Un disparo duplicado del mismo video quemaba dos runners en paralelo.
concurrency:
  group: render-${{ inputs.video }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # Un vídeo de diez minutos tarda entre 45 y 90 min en un runner de 2 núcleos
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Remotion arranca un Chrome sin cabeza: necesita estas librerías
      - name: Dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2t64

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar que el vídeo existe
        run: |
          if [ ! -f "content/${{ inputs.video }}.json" ]; then
            echo "No existe content/${{ inputs.video }}.json"
            echo "Vídeos disponibles:"
            ls content/*.json | grep -v timings | sed 's|content/||;s|\.json||'
            exit 1
          fi
          node -e "
            const t=require('./content/${{ inputs.video }}.timings.json');
            const c=require('./content/${{ inputs.video }}.json');
            const p=c.bloques.flatMap(b=>b.planos);
            const sin=p.filter(x=>!t[x.id]);
            const dur=p.reduce((a,x)=>a+(t[x.id]?t[x.id].duration+0.34:0),0);
            console.log(p.length+' planos · '+Math.floor(dur/60)+':'+String(Math.round(dur%60)).padStart(2,'0'));
            if(sin.length) console.log('AVISO: '+sin.length+' planos sin locutar: '+sin.map(x=>x.id).join(', '));
          "

      # Cambiar solo la imagen de un guion ya locutado no cuesta creditos.
      - name: Reescenificar antes de renderizar
        if: ${{ inputs.reescenificar }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          REHACER=""
          [ -n "${{ inputs.rehacer }}" ] && REHACER="--rehacer ${{ inputs.rehacer }}"
          node scripts/guion.mjs --reescenificar "content/${{ inputs.video }}.json" $REHACER
          git config user.name "capital-x-bot"
          git config user.email "actions@github.com"
          git add content/
          git diff --cached --quiet || { git commit -m "Escenas nuevas para ${{ inputs.video }}"; git pull --rebase --autostash -q; git push; }

      # Los recortes que vengan sin texto al lado se lo ponen aqui: una sola
      # llamada con un prompt corto, no las diecinueve del reescenificado.
      - name: Poner titular a los recortes que falten
        # Un titular que falta es cosmetico. No puede costar dos horas de
        # render, que es justo el error que llevo repitiendo todo el dia.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/titulares.mjs "content/${{ inputs.video }}.json"
          git config user.name "capital-x-bot"
          git config user.email "actions@github.com"
          git add content/
          git diff --cached --quiet || { git commit -m "Titulares de los recortes"; git pull --rebase --autostash -q; git push; }

      # Los clips se bajan en cada render, no se versionan: pesan demasiado.
      # La eleccion sí queda escrita en el guion, asi que siempre baja el mismo
      # y el video sale igual la proxima vez.
      # Los recortes de revista se hacen aqui: quitar el fondo necesita Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Herramientas de recorte
        run: pip install --quiet "rembg[cpu]" pillow numpy scipy

      - name: Traer los clips y los recortes
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node scripts/clips.mjs "content/${{ inputs.video }}.json"
          git config user.name "capital-x-bot"
          git config user.email "actions@github.com"
          git add content/
          git diff --cached --quiet || { git commit -m "Clips elegidos para ${{ inputs.video }}"; git pull --rebase --autostash -q; git push; }

      - name: Renderizar
        run: |
          npx remotion render "${{ inputs.video }}" \
            "out/${{ inputs.video }}.mp4" \
            --jpeg-quality=${{ inputs.calidad }} \
            --log=info

      - name: Masterizar el sonido a -14 LUFS
        run: |
          node scripts/master.mjs \
            "out/${{ inputs.video }}.mp4" \
            "out/${{ inputs.video }}-master.mp4"

      - name: Resumen
        run: |
          {
            echo "### ${{ inputs.video }}"
            echo ""
            ffprobe -v error -show_entries format=duration,size \
              -of default=nw=1 "out/${{ inputs.video }}-master.mp4"
          } >> "$GITHUB_STEP_SUMMARY"

      # Los artefactos de Actions comparten 500 MB para toda la cuenta y un
      # video son ochenta. Los ficheros de una publicacion van a otro almacen.
      - name: Publicar el vídeo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG=$(node -e "console.log(require('./content/${{ inputs.video }}.json').slug)")
          TITULO=$(node -e "const d=require('./content/${{ inputs.video }}.json');console.log(d.publicacion?.titulo||d.titulo)")
          ETIQUETA="video-$SLUG"
          cp "out/${{ inputs.video }}-master.mp4" "out/$SLUG.mp4"
          gh release delete "$ETIQUETA" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$ETIQUETA" "out/$SLUG.mp4" --title "$TITULO" --notes "Renderizado a mano desde content/${{ inputs.video }}.json"
          echo "## $TITULO" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Descargar el vídeo]($(gh release view "$ETIQUETA" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
