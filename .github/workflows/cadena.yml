name: Vídeo completo

# El mismo recorrido que lanzar.json, pero con el boton "Run workflow" de la
# pestana Actions: voz, render en paralelo, miniatura, subida a YouTube.
# Si prefieres escribir un fichero, usa lanzar.json.

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Qué vídeo (el slug de content/: revolucion-francesa…). Vacío si das un tema"
        required: false
        default: ""
        type: string
      tema:
        description: "O un tema de content/cola.json: lo investiga y lo escribe él solo"
        required: false
        default: ""
        type: string
      publicar:
        description: "Cómo se sube a YouTube"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]
      programar:
        description: "Hora de publicación en ISO (2026-10-25T18:00:00+02:00). Vacío = ahora"
        required: false
        default: ""
        type: string
      solo_render:
        description: "El vídeo ya está locutado: no gastar créditos de voz"
        required: false
        default: false
        type: boolean

concurrency:
  group: cadena-${{ inputs.video }}${{ inputs.tema }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produccion:
    uses: ./.github/workflows/produccion.yml
    with:
      video: ${{ inputs.video }}
      tema: ${{ inputs.tema }}
      publicar: ${{ inputs.publicar }}
      programar: ${{ inputs.programar }}
      solo_render: ${{ inputs.solo_render }}
    secrets: inherit
