name: Vídeo completo

# Locuta y renderiza de una sola vez, encadenado dentro de GitHub.
#
# Antes esto se encadenaba desde un ordenador: un bucle que lanzaba la voz,
# esperaba y luego lanzaba el render. Eso obligaba a tener la maquina
# encendida hasta el final. Aqui el render depende de la voz con "needs",
# asi que GitHub lo encadena solo y no hace falta nada en local.

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Qué vídeo (el slug: pensiones, alemania-trabajo…)"
        required: true
        type: string
      calidad:
        description: "Calidad de imagen (más alto = mejor y más pesado)"
        required: false
        default: "80"
        type: string
      reescenificar:
        description: "Rehacer la imagen antes de renderizar (no gasta créditos de voz)"
        required: false
        default: false
        type: boolean
      rehacer:
        description: "Qué escenas rehacer: vacío = solo las que falten · todo · b3,b7"
        required: false
        default: ""
        type: string

# Dos cadenas a la vez sobre el mismo video se pisarian al hacer push del
# audio, y se pagaria la locucion dos veces.
concurrency:
  group: cadena-${{ inputs.video }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  voz:
    uses: ./.github/workflows/voz.yml
    with:
      video: ${{ inputs.video }}
      solo_contar: false
    secrets: inherit

  render:
    needs: voz
    uses: ./.github/workflows/render.yml
    with:
      video: ${{ inputs.video }}
      calidad: ${{ inputs.calidad }}
      reescenificar: ${{ inputs.reescenificar }}
      rehacer: ${{ inputs.rehacer }}
    secrets: inherit
